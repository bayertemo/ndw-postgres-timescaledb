name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # The image changes when PostgreSQL or TimescaleDB does, not when we do.
  # A weekly build picks up base-image security patches without waiting for
  # somebody to notice one — and fails loudly if a pinned package version has
  # been withdrawn, which is how an unbuildable image is usually discovered
  # months too late.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Writing to GHCR needs this; the default token is read-only.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only a push to main publishes. A pull request still builds, so a
      # broken Dockerfile is caught before merge without pushing a tag
      # nothing asked for.
      #
      # No secret is needed: GITHUB_TOKEN authenticates to the registry of
      # the repository that owns the package.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verified BEFORE publishing, so a broken image is never pullable.
      #
      # A database image that builds but cannot load its extension fails at a
      # rolling restart of a primary otherwise, which is the wrong place to
      # find out. The build below reuses this layer cache, so proving it here
      # costs one container start rather than a second build.
      - name: Build and verify
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: verify:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the extension loads
        run: |
          docker run --rm --platform linux/amd64 --user 0 \
            -v "$PWD/test/verify.sh:/verify.sh:ro" \
            --entrypoint bash verify:local /verify.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

